<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Presensi Webinar - Ilmu Hukum</title>
    <!-- Tailwind CSS untuk Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        /* Custom scrollbar for dropdown */
        select { appearance: none; background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e"); background-position: right 0.5rem center; background-repeat: no-repeat; background-size: 1.5em 1.5em; padding-right: 2.5rem; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-slate-800 min-h-screen flex items-center justify-center p-4 sm:p-8">
    
    <div class="max-w-lg w-full glass-panel rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.3)] p-8 sm:p-10 relative overflow-hidden">
        <!-- Aksesoris Desain (Pita Emas di atas) -->
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-yellow-400 to-yellow-600"></div>

        <div class="text-center mb-8">
            <!-- Ikon Timbangan Hukum -->
            <div class="mx-auto w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mb-4 shadow-sm border border-blue-100">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-800" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3" />
                </svg>
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 tracking-tight">Portal Presensi</h1>
            <p class="text-sm font-medium text-blue-600 mt-1 uppercase tracking-wider">Program Studi Ilmu Hukum</p>
            <p class="text-xs text-slate-500 mt-2">Universitas Terbuka</p>
        </div>

        <form id="formAbsen" class="space-y-5">
            <!-- Grid untuk NIM & Kelas (Sebelah-sebelahan di layar agak besar) -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">NIM</label>
                    <input type="text" id="nim" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:border-blue-600 focus:bg-white transition-all outline-none text-slate-700 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Kelas</label>
                    <input type="text" id="kelas" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:border-blue-600 focus:bg-white transition-all outline-none text-slate-700 text-sm">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Nama Lengkap</label>
                <input type="text" id="nama" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:border-blue-600 focus:bg-white transition-all outline-none text-slate-700 text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Sesi Webinar</label>
                <select id="sesi" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:border-blue-600 focus:bg-white transition-all outline-none text-slate-700 text-sm font-medium">
                    <option value="Webinar #1: Hukum Pidana">Webinar #1: Hukum Pidana</option>
                    <option value="Webinar #2: Hukum Perdata">Webinar #2: Hukum Perdata</option>
                    <option value="Webinar #3: Hukum Administrasi Negara">Webinar #3: Hukum Administrasi Negara</option>
                </select>
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Keterangan</label>
                <select id="keterangan" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:border-blue-600 focus:bg-white transition-all outline-none text-slate-700 text-sm font-medium">
                    <option value="Hadir">Hadir</option>
                    <option value="Izin">Izin</option>
                    <option value="Sakit">Sakit</option>
                </select>
            </div>

            <div id="tokenContainer" class="p-4 bg-blue-50/50 border border-blue-100 rounded-xl">
                <label class="block text-xs font-semibold text-blue-800 uppercase tracking-wider mb-1.5">Token Kehadiran</label>
                <input type="text" id="token" placeholder="Masukkan token sesi ini..." class="w-full px-4 py-3 bg-white border border-blue-200 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 transition-all outline-none text-blue-900 font-bold uppercase tracking-widest text-center text-sm shadow-inner">
                <p class="text-[11px] text-blue-600 mt-2 text-center flex items-center justify-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
                    </svg>
                    Wajib diisi sebagai bukti kehadiran
                </p>
            </div>

            <button type="submit" id="btnSubmit" class="w-full mt-2 bg-gradient-to-r from-blue-700 to-blue-900 hover:from-blue-800 hover:to-slate-900 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-blue-900/30 transform transition duration-200 hover:-translate-y-0.5 active:translate-y-0">
                Kirim Kehadiran
            </button>
        </form>

        <div id="notif" class="mt-5 hidden text-center text-sm font-medium p-4 rounded-xl border"></div>
        
        <!-- Copyright / Footer -->
        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
            <p class="text-[10px] text-slate-400 font-medium uppercase tracking-widest">Sistem berinovasi hak cipta</p>
            <p class="text-xs text-slate-500 font-semibold mt-0.5">Muhammad Rizky Arfiansyah</p>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyFKfsv4kt8JJt-gJMdELk8unRPEvl4sit4R4ud6Js5niDDd2URkP6QCS8kKoHnoks/exec'; 
        
        const form = document.getElementById('formAbsen');
        const btnSubmit = document.getElementById('btnSubmit');
        const notif = document.getElementById('notif');
        const keteranganSelect = document.getElementById('keterangan');
        const tokenContainer = document.getElementById('tokenContainer');
        const tokenInput = document.getElementById('token');

        keteranganSelect.addEventListener('change', (e) => {
            if (e.target.value !== 'Hadir') {
                tokenContainer.style.opacity = '0';
                tokenContainer.style.height = '0';
                tokenContainer.style.overflow = 'hidden';
                tokenContainer.style.padding = '0';
                tokenContainer.style.marginTop = '0';
                tokenContainer.style.border = 'none';
                setTimeout(() => { tokenContainer.style.display = 'none'; }, 300);
                tokenInput.value = '-'; 
            } else {
                tokenContainer.style.display = 'block';
                setTimeout(() => {
                    tokenContainer.style.opacity = '1';
                    tokenContainer.style.height = 'auto';
                    tokenContainer.style.padding = '1rem';
                    tokenContainer.style.marginTop = '1.25rem';
                    tokenContainer.style.border = '1px solid #dbeafe';
                }, 10);
                tokenInput.value = '';
            }
        });

        form.addEventListener('submit', e => {
            e.preventDefault();
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = `<svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline-block" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Memproses...`;

            const data = {
                nim: document.getElementById('nim').value,
                nama: document.getElementById('nama').value,
                kelas: document.getElementById('kelas').value,
                sesi: document.getElementById('sesi').value,
                keterangan: document.getElementById('keterangan').value,
                token: document.getElementById('token').value
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(() => {
                notif.textContent = 'Berhasil! Kehadiran Anda telah dicatat.';
                notif.className = 'mt-5 block text-center text-sm font-semibold p-4 rounded-xl bg-emerald-50 text-emerald-600 border border-emerald-200 shadow-sm';
                form.reset();
                
                // Reset Token Display
                tokenContainer.style.display = 'block';
                tokenContainer.style.opacity = '1';
                tokenContainer.style.height = 'auto';
                tokenContainer.style.padding = '1rem';
                tokenContainer.style.border = '1px solid #dbeafe';
            })
            .catch(error => {
                notif.textContent = 'Terjadi kesalahan jaringan, silakan coba lagi.';
                notif.className = 'mt-5 block text-center text-sm font-semibold p-4 rounded-xl bg-rose-50 text-rose-600 border border-rose-200 shadow-sm';
            })
            .finally(() => {
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Kirim Kehadiran';
                
                setTimeout(() => {
                    notif.className = 'hidden';
                }, 6000);
            });
        });
    </script>
</body>
</html>
