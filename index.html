<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Hukum Perjanjian - Ilmu Hukum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-slate-800 min-h-screen flex items-center justify-center p-4 sm:p-8">
    
    <div class="max-w-lg w-full glass-panel rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.3)] p-8 sm:p-10 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-yellow-400 to-yellow-600"></div>

        <div class="text-center mb-8">
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 tracking-tight">Hukum Perjanjian</h1>
            <p class="text-sm font-medium text-blue-600 mt-1 uppercase tracking-wider">Portal Presensi Webinar</p>
            <p class="text-xs text-slate-500 mt-2">Universitas Terbuka - Ilmu Hukum</p>
        </div>

        <form id="formAbsen" class="space-y-5">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">NIM</label>
                    <input type="text" id="nim" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none text-slate-700 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Kelas</label>
                    <input type="text" id="kelas" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none text-slate-700 text-sm">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Nama Lengkap</label>
                <input type="text" id="nama" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none text-slate-700 text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Sesi Webinar</label>
                <select id="sesi" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none text-slate-700 text-sm font-medium">
                    <option value="Sesi 1: Pengantar Hukum Perjanjian">Sesi 1: Pengantar Hukum Perjanjian</option>
                    <option value="Sesi 2: Syarat Sahnya Perjanjian">Sesi 2: Syarat Sahnya Perjanjian</option>
                    <option value="Sesi 3: Wanprestasi & Keadaan Memaksa">Sesi 3: Wanprestasi & Keadaan Memaksa</option>
                </select>
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Keterangan</label>
                <select id="keterangan" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none text-slate-700 text-sm font-medium">
                    <option value="Hadir">Hadir</option>
                    <option value="Izin">Izin</option>
                    <option value="Sakit">Sakit</option>
                </select>
            </div>

            <div id="tokenContainer" class="p-4 bg-blue-50/50 border border-blue-100 rounded-xl">
                <label class="block text-xs font-semibold text-blue-800 uppercase tracking-wider mb-1.5">Token Kehadiran</label>
                <input type="text" id="token" placeholder="Masukkan token sesi ini..." class="w-full px-4 py-3 bg-white border border-blue-200 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:border-yellow-500 outline-none text-blue-900 font-bold uppercase tracking-widest text-center text-sm shadow-inner">
                <p class="text-[11px] text-blue-600 mt-2 text-center flex items-center justify-center gap-1">
                    Wajib diisi sebagai bukti kehadiran
                </p>
            </div>

            <button type="submit" id="btnSubmit" class="w-full mt-2 bg-gradient-to-r from-blue-700 to-blue-900 hover:from-blue-800 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-blue-900/30 transition duration-200">
                Kirim Kehadiran
            </button>
        </form>

        <div id="notif" class="mt-5 hidden text-center text-sm font-medium p-4 rounded-xl border"></div>
        
        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
            <p class="text-[10px] text-slate-400 font-medium uppercase tracking-widest">Sistem web dikembangkan oleh</p>
            <p class="text-xs text-slate-500 font-semibold mt-0.5">Muhammad Rizky Arfiansyah</p>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwc76GubIEmQCQPaq6TS2-SZK33jimqljRbFxJuJWuSwrrapV5zqc5Y0_gh3KW6TmEm/exec'; 
        
        const form = document.getElementById('formAbsen');
        const btnSubmit = document.getElementById('btnSubmit');
        const notif = document.getElementById('notif');
        const keteranganSelect = document.getElementById('keterangan');
        const tokenContainer = document.getElementById('tokenContainer');
        const tokenInput = document.getElementById('token');

        keteranganSelect.addEventListener('change', (e) => {
            if (e.target.value !== 'Hadir') {
                tokenContainer.style.display = 'none';
                tokenInput.value = '-'; 
            } else {
                tokenContainer.style.display = 'block';
                tokenInput.value = '';
            }
        });

        form.addEventListener('submit', e => {
            e.preventDefault();
            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Memproses...';

            const data = {
                nim: document.getElementById('nim').value,
                nama: document.getElementById('nama').value,
                kelas: document.getElementById('kelas').value,
                sesi: document.getElementById('sesi').value,
                keterangan: document.getElementById('keterangan').value,
                token: document.getElementById('token').value
            };

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors', 
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(() => {
                notif.textContent = 'Data Terkirim! (Pastikan Token Benar)';
                notif.className = 'mt-5 block text-center text-sm font-semibold p-4 rounded-xl bg-emerald-50 text-emerald-600 border border-emerald-200';
                form.reset();
                tokenContainer.style.display = 'block';
            })
            .catch(error => {
                notif.textContent = 'Terjadi kesalahan jaringan.';
                notif.className = 'mt-5 block text-center text-sm font-semibold p-4 rounded-xl bg-rose-50 text-rose-600 border border-rose-200';
            })
            .finally(() => {
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Kirim Kehadiran';
                setTimeout(() => { notif.className = 'hidden'; }, 5000);
            });
        });
    </script>
</body>
</html>
