<form id="formAbsen" class="space-y-4">
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">NIM</label>
            <input type="text" id="nim" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap</label>
            <input type="text" id="nama" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Kelas</label>
            <input type="text" id="kelas" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Pilih Sesi Webinar</label>
            <select id="sesi" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <option value="Webinar #1: Hukum Pidana">Webinar #1: Hukum Pidana</option>
                <option value="Webinar #2: Hukum Perdata">Webinar #2: Hukum Perdata</option>
                <option value="Webinar #3: Hukum Perjanjian">Webinar #3: Hukum Perjanjian</option>
            </select>
        </div>
        
         <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Keterangan</label>
            <select id="keterangan" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                <option value="Hadir">Hadir</option>
                <option value="Izin">Izin</option>
                <option value="Sakit">Sakit</option>
            </select>
        </div>

        <div id="tokenContainer">
            <label class="block text-sm font-medium text-slate-700 mb-1">Token Kehadiran</label>
            <input type="text" id="token" placeholder="Masukkan token dari ketua kelas" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none uppercase">
             <p class="text-xs text-slate-500 mt-1">Kosongkan jika Izin/Sakit</p>
        </div>

        <button type="submit" id="btnSubmit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition duration-200">
            Kirim Kehadiran
        </button>
    </form>

    <div id="notif" class="mt-4 hidden text-center text-sm font-medium p-3 rounded-lg"></div>
</div>

<script>
    // URL Web App dari Apps Script Anda
    const scriptURL = 'https://script.google.com/macros/s/AKfycbyFKfsv4kt8JJt-gJMdELk8unRPEvl4sit4R4ud6Js5niDDd2URkP6QCS8kKoHnoks/exec'; 
    
    const form = document.getElementById('formAbsen');
    const btnSubmit = document.getElementById('btnSubmit');
    const notif = document.getElementById('notif');
    const keteranganSelect = document.getElementById('keterangan');
    const tokenContainer = document.getElementById('tokenContainer');
    const tokenInput = document.getElementById('token');

    // Logic sembunyikan field token jika Izin/Sakit
    keteranganSelect.addEventListener('change', (e) => {
        if (e.target.value !== 'Hadir') {
            tokenContainer.style.display = 'none';
            tokenInput.value = '-'; 
        } else {
            tokenContainer.style.display = 'block';
            tokenInput.value = '';
        }
    });

    form.addEventListener('submit', e => {
        e.preventDefault();
        btnSubmit.disabled = true;
        btnSubmit.textContent = 'Mengirim...';

        const data = {
            nim: document.getElementById('nim').value,
            nama: document.getElementById('nama').value,
            kelas: document.getElementById('kelas').value,
            sesi: document.getElementById('sesi').value,
            keterangan: document.getElementById('keterangan').value,
            token: document.getElementById('token').value
        };

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors', 
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        })
        .then(() => {
            notif.textContent = 'Berhasil! Kehadiran Anda telah dicatat.';
            notif.className = 'mt-4 block text-center text-sm font-medium p-3 rounded-lg bg-emerald-50 text-emerald-700';
            form.reset();
            tokenContainer.style.display = 'block'; // Reset tampilan token
        })
        .catch(error => {
            notif.textContent = 'Terjadi kesalahan, silakan coba lagi.';
            notif.className = 'mt-4 block text-center text-sm font-medium p-3 rounded-lg bg-rose-50 text-rose-700';
        })
        .finally(() => {
            btnSubmit.disabled = false;
            btnSubmit.textContent = 'Kirim Kehadiran';
            
            // Sembunyikan notifikasi setelah 5 detik
            setTimeout(() => {
                notif.className = 'hidden';
            }, 5000);
        });
    });
</script>
