<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi Hukum Perjanjian - Ilmu Hukum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        select { appearance: none; background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e"); background-position: right 0.5rem center; background-repeat: no-repeat; background-size: 1.5em 1.5em; padding-right: 2.5rem; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-slate-800 min-h-screen flex items-center justify-center p-4 sm:p-8">
    
    <div class="max-w-lg w-full glass-panel rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.3)] p-8 sm:p-10 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-yellow-400 to-yellow-600"></div>

        <div class="text-center mb-8">
            <div class="mx-auto w-16 h-16 bg-blue-50 rounded-full flex items-center justify-center mb-4 shadow-sm border border-blue-100">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-800" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3" />
                </svg>
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold text-slate-800 tracking-tight">Hukum Perjanjian</h1>
            <p class="text-sm font-medium text-blue-600 mt-1 uppercase tracking-wider">Portal Presensi Webinar</p>
            <p class="text-xs text-slate-500 mt-2">Universitas Terbuka - Ilmu Hukum</p>
        </div>

        <form id="formAbsen" class="space-y-5">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">NIM</label>
                    <input type="text" id="nim" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none text-slate-700 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Kelas</label>
                    <input type="text" id="kelas" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none text-slate-700 text-sm">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Nama Lengkap</label>
                <input type="text" id="nama" required class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none text-slate-700 text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Sesi Webinar</label>
                <select id="sesi" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none text-slate-700 text-sm font-medium">
                    <option value="Sesi 1">Sesi 1</option>
                    <option value="Sesi 2">Sesi 2</option>
                    <option value="Sesi 3">Sesi 3</option>
                </select>
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Keterangan</label>
                <select id="keterangan" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-600 focus:border-blue-600 outline-none text-slate-700 text-sm font-medium">
                    <option value="Hadir">Hadir</option>
                    <option value="Izin">Izin</option>
                    <option value="Sakit">Sakit</option>
                </select>
            </div>

            <div id="wajibHadirContainer" class="space-y-4 p-4 bg-blue-50/50 border border-blue-100 rounded-xl">
                <!-- Input Token -->
                <div>
                    <label class="block text-xs font-semibold text-blue-800 uppercase tracking-wider mb-1.5">Token Kehadiran</label>
                    <input type="text" id="token" placeholder="Masukkan token sesi ini..." class="w-full px-4 py-3 bg-white border border-blue-200 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none text-blue-900 font-bold uppercase tracking-widest text-center text-sm shadow-inner transition-colors">
                </div>
                
                <!-- Input File Screenshot -->
                <div>
                    <label class="block text-xs font-semibold text-blue-800 uppercase tracking-wider mb-1.5">Bukti Screenshot Meeting</label>
                    <input type="file" id="bukti" accept="image/*" class="w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-700 transition-all cursor-pointer bg-white border border-blue-200 rounded-lg p-1.5">
                    <p class="text-[10px] text-blue-600 mt-2 text-center">Wajib dilampirkan (Max. 3MB)</p>
                </div>
            </div>

            <button type="submit" id="btnSubmit" class="w-full mt-2 bg-gradient-to-r from-blue-700 to-blue-900 hover:from-blue-800 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-blue-900/30 transition duration-200">
                Kirim Kehadiran
            </button>
        </form>

        <div id="notif" class="mt-5 hidden text-center text-sm font-medium p-4 rounded-xl border transition-all"></div>
        
        <div class="mt-8 pt-6 border-t border-slate-100 text-center">
            <p class="text-[10px] text-slate-400 font-medium uppercase tracking-widest">Sistem berinovasi hak cipta</p>
            <p class="text-xs text-slate-500 font-semibold mt-0.5">Muhammad Rizky Arfiansyah</p>
        </div>
    </div>

    <script>
        // MASUKKAN URL APPS SCRIPT ANDA DI SINI
        const scriptURL = 'https://script.google.com/macros/s/AKfycbz7ZadVKBnS2oI6NxVhwVoacI5guq6g9QxD_NY1QTNIz6Otim2pgAmQlnqzjfqHgIAl/exec'; 
        
        const form = document.getElementById('formAbsen');
        const btnSubmit = document.getElementById('btnSubmit');
        const notif = document.getElementById('notif');
        
        const keteranganSelect = document.getElementById('keterangan');
        const wajibHadirContainer = document.getElementById('wajibHadirContainer');
        const tokenInput = document.getElementById('token');
        const buktiInput = document.getElementById('bukti');
        const sesiSelect = document.getElementById('sesi');

        // Logic menyembunyikan Token & Upload Gambar jika Izin/Sakit
        keteranganSelect.addEventListener('change', (e) => {
            if (e.target.value !== 'Hadir') {
                wajibHadirContainer.style.display = 'none';
                tokenInput.value = '-'; 
                buktiInput.value = ''; // Reset file input
            } else {
                wajibHadirContainer.style.display = 'block';
                tokenInput.value = '';
            }
        });

        form.addEventListener('submit', e => {
            e.preventDefault(); 
            
            const sesiDipilih = sesiSelect.value;
            const tokenDimasukkan = tokenInput.value.trim().toUpperCase();
            const keteranganDipilih = keteranganSelect.value;

            // 1. VALIDASI TOKEN SECARA LOKAL
            if (keteranganDipilih === 'Hadir') {
                let tokenValid = false;
                // TOKEN BARU YANG SULIT DITEBAK
                if (sesiDipilih === "Sesi 1" && tokenDimasukkan === "HKPX-782A") tokenValid = true;
                else if (sesiDipilih === "Sesi 2" && tokenDimasukkan === "HKPX-419B") tokenValid = true;
                else if (sesiDipilih === "Sesi 3" && tokenDimasukkan === "HKPX-935C") tokenValid = true;

                if (!tokenValid) {
                    alert("❌ AKSES DITOLAK! Token yang Anda masukkan SALAH atau TIDAK SESUAI dengan Sesi yang dipilih.");
                    
                    tokenInput.value = '';
                    tokenInput.focus();
                    tokenInput.classList.add('border-red-500', 'bg-red-50');
                    
                    notif.textContent = 'Peringatan: Token Salah! Silakan coba lagi.';
                    notif.className = 'mt-5 block text-center text-sm font-bold p-4 rounded-xl bg-red-100 text-red-700 border border-red-400 shadow-sm';
                    
                    setTimeout(() => { 
                        notif.className = 'hidden'; 
                        tokenInput.classList.remove('border-red-500', 'bg-red-50');
                    }, 5000);
                    
                    return; 
                }

                // 2. Validasi File Gambar khusus untuk yang Hadir
                if (buktiInput.files.length === 0) {
                     alert("⚠️ GAGAL! Anda wajib melampirkan Bukti Screenshot Meeting.");
                     return; 
                }
            }

            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Memproses Upload... (Mohon tunggu)';
            
            notif.textContent = 'Sedang mengirim data dan mengunggah gambar...';
            notif.className = 'mt-5 block text-center text-sm font-semibold p-4 rounded-xl bg-blue-50 text-blue-600 border border-blue-200';

            const kirimData = (base64String, fileName, mimeType) => {
                const data = {
                    nim: document.getElementById('nim').value,
                    nama: document.getElementById('nama').value,
                    kelas: document.getElementById('kelas').value,
                    sesi: sesiDipilih,
                    keterangan: keteranganDipilih,
                    token: tokenDimasukkan,
                    fileBase64: base64String,
                    fileName: fileName,
                    mimeType: mimeType
                };

                fetch(scriptURL, {
                    method: 'POST',
                    mode: 'no-cors', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                })
                .then(() => {
                    notif.textContent = '✅ Data & Foto Berhasil Terkirim!';
                    notif.className = 'mt-5 block text-center text-sm font-bold p-4 rounded-xl bg-emerald-100 text-emerald-700 border border-emerald-400 shadow-sm';
                    form.reset();
                    wajibHadirContainer.style.display = 'block';
                })
                .catch(error => {
                    alert("Terjadi kesalahan jaringan, silakan coba lagi.");
                    notif.textContent = 'Terjadi kesalahan jaringan.';
                    notif.className = 'mt-5 block text-center text-sm font-bold p-4 rounded-xl bg-rose-100 text-rose-700 border border-rose-300';
                })
                .finally(() => {
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = 'Kirim Kehadiran';
                    setTimeout(() => { notif.className = 'hidden'; }, 6000);
                });
            };

            if (keteranganDipilih === 'Hadir' && buktiInput.files.length > 0) {
                const file = buktiInput.files[0];
                const reader = new FileReader();
                reader.onload = function(event) {
                    kirimData(event.target.result, file.name, file.type);
                };
                reader.readAsDataURL(file);
            } else {
                kirimData("", "", "");
            }
        });
    </script>
</body>
</html>
